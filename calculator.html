<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>程序员计算器</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#4CAF50">
<style>
* {
    font-size: 24px;
    letter-spacing: 0;
    /* font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Segoe UI", "Liberation Mono", monospace; */
    /* font-family: "Consolas", "Lucida Console", monospace; */
    /* font-family: monospace; */
    font-family: Consolas, Menlo, Monaco, "Roboto Mono", "Droid Sans Mono", monospace;
}
table {
    width: 100%;
}
td {
    padding: 10px 1vw;
    height: 8vw;
}
.td_base_type {
    color: cornflowerblue;
    padding: 0;
    width: 10vw;
    text-align: right;
}
.td_base_type input {
    margin: 0;
}
.td_base_type label {
    margin: 0;
}
.td_base_value {
    text-align: right;
}
.td_base_value div {
    float: right;
    /* word-break: break-all; */
    white-space: pre-wrap;
}
.base_tr td {
    border-bottom: black solid 1px;
}
input[type=text] {
    width: 100%;
    padding: 10px;
}
.active {
    color: chartreuse;
}
.error {
    color: red;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 5vw;
}
.button_tb {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed
}
.button_tb td, .button_tb th {
    padding: 10px;
    border: 1px solid #000;
    text-align: center;
}
</style>
</head>

<body ng-app="myApp" ng-controller="myCtrl">
    <table>
        <tr>
            <td colspan="2">
                <input id="RES" type="text" ng-model="RES.value" ng-change="ChangeIpt()" placeholder="输入数学表达式"/>
            </td>
        </tr>
        <tr class="base_tr">
            <td class="td_base_type">
                <label ng-class="DEC.selected?'active':''" ng-click="SelectBase(DEC)">DEC</label>
            </td>
            <td class="td_base_value">
                <div>{{DEC.value}}</div>
            </td>
        </tr>
        <tr class="base_tr">
            <td class="td_base_type">
                <label ng-class="HEX.selected?'active':''" ng-click="SelectBase(HEX)">HEX</label>
            </td>
            <td class="td_base_value">
                <div>{{HEX.value}}</div>
            </td>
        </tr>
        <tr class="base_tr" ng-if="false">
            <td class="td_base_type">
                <label ng-class="OTC.selected?'active':''" ng-click="SelectBase(OTC)">OTC</label>
            </td>
            <td class="td_base_value">
                <div>{{OTC.value}}</div>
            </td>
        </tr>
        <tr class="base_tr">
            <td class="td_base_type">
                <label ng-class="BIN.selected?'active':''" ng-click="SelectBase(BIN)">BIN</label>
            </td>
            <td class="td_base_value">
                <div>{{BIN.value}}</div>
            </td>
        </tr>
    </table>
    <table class="button_tb">
        <tr>
            <td>&</td>
            <td>|</td>
            <td>!</td>
            <td>^</td>
        </tr>
        <tr>
            <td>(</td>
            <td>)</td>
            <td><<</td>
            <td>>></td>
        </tr>
        <tr>
            <td>D</td>
            <td>E</td>
            <td>F</td>
            <td>CL</td>
        </tr>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>/</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>*</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>-</td>
        </tr>
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>+</td>
        </tr>
        <tr>
            <td>↻</td>
            <td>0</td>
            <td>←</td>
            <td>=</td>
        </tr>
    </table>
    <button ng-click="Clear()">清空</button>
</body>

<!-- <script src="js/jquery-3.0.0.min.js"></script> -->
<script src="js/angular.min.js"></script>
<script src="js/my_tool.js"></script>
<script>
    window.onload = function() {
        RES.focus();
    };
    function ToNum(val) {
        val = val.toString();
        val = val.replace(/\w(?=(\w{16})+(?!\w))/g, '$&\n');
        val = val.replace(/\w(?=(\w{4})+(?!\w))/g, '$& ');
        return val;
    }
    var app = angular.module('myApp', []);
    app.controller('myCtrl', function($scope, $http) {
        $scope.RES = {value: '', selected: false};
        $scope.DEC = {value: 0, selected: true};
        $scope.HEX = {value: 0, selected: false};
        $scope.OTC = {value: 0, selected: false};
        $scope.BIN = {value: 0, selected: false};

        $scope.ChangeIpt = function() {
            var exp = $scope.RES.value.toString();
            if ($scope.HEX.selected) {
                exp =  exp.replace(/(\w+)/g, "0x$1");
            } else if ($scope.OTC.selected) {
                exp =  exp.replace(/(\w+)/g, "0o$1");
            } else if ($scope.BIN.selected) {
                exp =  exp.replace(/(\w+)/g, "0b$1");
            }
            RES.classList.remove('error');
            try {
                var res = eval(exp);
            } catch (error) {
                RES.classList.add('error');
                console.error("exp err:", error.message);
                return;
            }
            $scope.DEC.value = ToNum(res.toString(10));
            $scope.HEX.value = ToNum(res.toString(16).toUpperCase());
            $scope.OTC.value = ToNum(res.toString(8));
            $scope.BIN.value = ToNum(res.toString(2));
        };

        $scope.SelectBase = function(base) {
            // $scope.RES.value = '';
            $scope.DEC.selected = false;
            $scope.HEX.selected = false;
            $scope.OTC.selected = false;
            $scope.BIN.selected = false;
            base.selected = true;
            RES.focus();
            $scope.ChangeIpt();
        };

        $scope.Clear = function() {
            $scope.RES.value = '';
            RES.focus();
        };
    });
</script>

</html>
