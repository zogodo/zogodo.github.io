<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>地球仪</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        #cesiumContainer {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>
    <script>
        // 1. 设置 Token (在 Cesium ion 官网申请)
        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1ZWYwNjM3Ny04MzkxLTQwNDYtYTU3OS00YjUxMmVmMGZjZmMiLCJpZCI6Mzg1OTc1LCJpYXQiOjE3NzAwMDMxNjh9.-ka9x7kNq2LueWtl5cLqPyUuId4orkNeYVLfvij_gog";

        // 1. 初始化 Viewer，关闭自带的影像（默认是卫星图）
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: false, // 不加载默认卫星图
            baseLayerPicker: false, // 隐藏图层选择器
            terrainProvider: undefined // 确保不加载地形
        });

        // 2. 加载 GeoJSON 数据
        const loadGlobalMap = async () => {
            try {
                const dataSource = await Cesium.GeoJsonDataSource.load(
                    'https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson',
                    {
                        stroke: Cesium.Color.WHITE,    // 边界线颜色
                        fill: Cesium.Color.fromCssColorString('#3d3d3d'), // 默认填充色
                        strokeWidth: 2,                // 线宽
                        markerSize: 0
                    }
                );

                viewer.dataSources.add(dataSource);

                // 3. 为每个国家设置随机颜色（或根据数据字段设置）
                const entities = dataSource.entities.values;
                for (let i = 0; i < entities.length; i++) {
                    const entity = entities[i];
                    entity.polygon.material = Cesium.Color.fromRandom({
                        alpha: 0.8 // 设置透明度
                    });
                    // 移除多边形的轮廓（如果需要更清晰的填充感）
                    entity.polygon.outline = true;
                    entity.polygon.outlineColor = Cesium.Color.BLACK;
                }
            } catch (error) {
                console.error("加载地图数据失败:", error);
            }
        };

        loadGlobalMap();
    </script>
</body>

</html>
