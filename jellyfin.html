<!DOCTYPE html>

<html lang="en-us">
<head>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <title>Jellyfin</title>
    <link rel="manifest" href="./manifest2.json">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            max-width: 500px;
            margin: auto;
            background: #3b3b3b;
            color: #ddd;
        }
        .container {
            width: 100%;
            aspect-ratio: 16/9;
        }
        input {
            border-radius: 0;
            border: none;
        }
        .item a {
            overflow-wrap: break-word;
            word-wrap: break-word;
            word-break: break-all;
            color: #ddd;
        }
        a:visited {
            color: #ddd;
        }
        .container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #f0f0f0;
        }
        .ipt_div {
            height: 87px;
            box-sizing: border-box;
            padding: 6px;
            position: fixed;
            top: 0px;
            left: 0px;
            right: 0px;
            background: #202020;
        }
        .ipt_div input {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .sort_buttons {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .sort_buttons button {
            flex: 1;
            padding: 6px;
        }
        p {
            margin: 90px 0 10px 0;
        }
        .but_api_key {
            float: right;
        }
        .v_count {
            position: fixed;
            bottom: 0px;
            right: 0px;
            padding: 6px;
            background: #202020;
        }
    </style>
</head>
<body ng-app="myApp" ng-controller="myCtrl">
    <div class="ipt_div">
    <input ng-model="filter" ng-change="FilterVideo()" placeholder="空格隔开可多重匹配"/>
    <div class="sort_buttons" ng-if="api_key&&filter.length!=32">
        <button ng-click="SortVideo('random')">随机排序</button>
        <button ng-click="SortVideo('date')">按添加时间倒序</button>
    </div>
    <div class="sort_buttons" ng-if="!api_key||filter.length==32">
        <button class="but_api_key" ng-click="SetApiKey()">set api key</button>
    </div>
    </div>
    <div class="item" ng-repeat="video in videos" ng-if="video.Type=='Video'">
        <div class="container">
            <a target="_blank" href="{{server}}/Videos/{{video.Id}}/stream?static=true&api_key={{api_key}}">
                <img src="{{server}}/Items/{{video.Id}}/Images/Primary?api_key={{api_key}}&maxWidth=960&maxHeight=540&tag={{video.ImageTags.Primary}}" style="width:100%">
            </a>
        </div>
        <a target="_blank" href="{{server}}/web/#/details?id={{video.Id}}">{{video.Path}}</a>
        <br/>
        <br/>
    </div>
    <span class="v_count">{{videos.length}}</span>
</body>

<script src="js/angular.min.js"></script>
<script src="js/my_tool.js"></script>
<script>
    function Perm(n) {
        const res = Array.from({ length: n }, (_, i) => i);
        for (let i = n - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [res[i], res[j]] = [res[j], res[i]];
        }
        return res;
    }
    var app = angular.module('myApp', []);
    app.controller('myCtrl', function($scope, $http) {
        var all_videos = [];
        $scope.filter = "";
        $scope.server = 'http://192.168.33.192:9096';
        if (window.location.href.includes("github.io")) {
            $scope.server = 'https://zogodo.duckdns.org:9743';
        }
        $scope.api_key = localStorage.getItem("api_key");
        $scope.ParentId = '0b530665b2fc4c202ed078fee34ef85a';
        var url = `${$scope.server}/Items?ParentId=${$scope.ParentId}&Recursive=true&Fields=Path,DateCreated&api_key=${$scope.api_key}`;
        $http.get(url).then(function(response) {
            for (const item of response.data.Items) {
                if (item.Type != 'Video') {
                    continue;
                }
                all_videos.push(item);
            }
            all_videos.sort(function(a, b) {
                return new Date(b.DateCreated) - new Date(a.DateCreated);
            });
            $scope.videos = all_videos.slice(0, 100); //只拿前100个,太多了页面卡
        });

        $scope.FilterVideo = function() {
            $scope.videos = [];
            var texts = $scope.filter.split(' ');
            for (var i in all_videos) {
                var has_all = true;
                for (var j in texts) {
                    if (!all_videos[i].Path.includes(texts[j])) {
                        has_all = false;
                        break;
                    }
                }
                if (has_all) $scope.videos.push(all_videos[i]);
                if ($scope.videos.length >= 100) break;
            }
        };

        $scope.SortVideo = function(mode) {
            if (mode === 'random') {
                var indexes = Perm(all_videos.length);
                all_videos = indexes.map(function(index) {
                    return all_videos[index];
                });
            } else if (mode === 'date') {
                all_videos.sort(function(a, b) {
                    return new Date(b.DateCreated) - new Date(a.DateCreated);
                });
            }
            $scope.FilterVideo();
        };

        $scope.SetApiKey = function() {
            $scope.api_key = $scope.filter;
            localStorage.setItem("api_key", $scope.api_key);
            location.reload();
        };
    });
</script>

</html>
