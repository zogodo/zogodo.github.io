<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>地球仪</title>
    <link rel="icon" href="https:/ion.cesium.com/favicon.ico">
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.137/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        #cesiumContainer {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>
    <script>
        // 注意：必须在 new Cesium.Viewer 之前执行
        Cesium.Camera.DEFAULT_VIEW_RECTANGLE = Cesium.Rectangle.fromDegrees(
            73.0, 15.0, 135.0, 55.0 // 西、南、东、北（大致覆盖中国版图）
        );
        // Cesium.Camera.DEFAULT_VIEW_FACTOR = 1.2; // 视角缩放因子，越大看得越远

        // 1. 初始化 Viewer (不使用默认影像)
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: false
        });

        const tk = '5f7d37357966d5d0c2b3ffa59ad13c75'; // 必须去天地图官网申请

        var ml = 18; //不设置的话放大会变空白
        // 2. 添加【矢量底图】 (只有路网、行政区、水系)
        const vecLayer = new Cesium.WebMapTileServiceImageryProvider({
            url: `https://t0.tianditu.gov.cn/vec_w/wmts?tk=${tk}`,
            layer: "vec",
            style: "default",
            format: "tiles",
            tileMatrixSetID: "w",
            maximumLevel: ml,
        });
        viewer.imageryLayers.addImageryProvider(vecLayer);

        // 3. 添加【中文注记】 (这步才是显示文字的关键！)
        const cvaLayer = new Cesium.WebMapTileServiceImageryProvider({
            url: `https://t0.tianditu.gov.cn/cva_w/wmts?tk=${tk}`,
            layer: "cva",
            style: "default",
            format: "tiles",
            tileMatrixSetID: "w",
            maximumLevel: ml,
        });
        viewer.imageryLayers.addImageryProvider(cvaLayer);
    </script>
</body>

</html>
